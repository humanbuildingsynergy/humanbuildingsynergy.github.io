name: Build and deploy to GitHub Pages

# This builds on every push to main, but GitHub only *serves* the result once
# Settings → Pages → Source is set to "GitHub Actions". Until then it is a dry
# run you can inspect under the Actions tab, and the existing site stays live.

on:
  push:
    branches: [main]

  # The publication list is fetched from ORCID during the build, so the site
  # only learns about a new paper when a build runs. This rebuilds weekly with
  # no push, which is what makes claiming a paper in ORCID enough on its own.
  #
  # GitHub disables scheduled workflows after 60 days of repository inactivity
  # and emails about it; re-enable from the Actions tab. Times are UTC and runs
  # can be delayed under load — nothing here depends on the exact minute.
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC — midnight Tucson

  # Also runnable on demand: Actions → Build and deploy → Run workflow. Use it
  # when you have just claimed something in ORCID and don't want to wait.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
