name: Draft news for new papers

# The announcements on /news/ are hand-written and should stay that way. What
# is automated is the reminder: when a paper appears on the publications list
# with no announcement, this opens a pull request containing a stub. The
# sentence still has to be rewritten by a person before it is merged, so
# nothing reaches the site unreviewed.

on:
  schedule:
    - cron: "30 8 * * 1"   # Mondays, after the deploy and the link check
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reads ORCID for the paper list, so it sees anything newly claimed.
      - run: node tools/draft-news.mjs --write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: draft-news
          title: "Draft announcements for new papers"
          commit-message: "Add draft news entries for newly published papers"
          labels: draft-news
          body: |
            A paper appeared on the publications list with no announcement on
            /news/, so this adds a stub for it.

            **The wording is placeholder.** Rewrite each `text:` in the lab's
            own voice before merging, and delete the `# DRAFT` comment. Close
            this PR if the paper does not warrant an announcement.

            Generated by `tools/draft-news.mjs`.
