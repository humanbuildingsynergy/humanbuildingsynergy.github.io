# The three relationships in the human / AI / building triangle.
# Each edge runs both ways; `left` and `right` are the two directions.
#
# Order matters. Edge 01 is the direct human–building relationship, which is as
# old as shelter. Edges 02 and 03 are what appears when an agent is inserted
# between them — and the list is not closed.
intro: >-
  For most of architectural history there was one relationship: you and the
  building, directly. Putting an agent between them does not replace it — it
  creates two more alongside it, and there will be more than three before long.

edges:
  - n: "01"
    left:
      party: bldg
      title: Building → Human
      text: >-
        The part that needs no AI at all — radiant heat, glare, draft, noise.
        You feel the building directly, and always did.
    right:
      party: human
      title: Human → Building
      text: >-
        You open a window, move desks, tape over a diffuser. The most honest
        feedback in the building, and nobody logs it.

  - n: "02"
    left:
      party: human
      title: Human → AI
      text: >-
        "It's stuffy." Language is cheap, high-bandwidth and ambiguous — and it
        carries intent that no sensor can infer.
    right:
      party: ai
      title: AI → Human
      text: >-
        Explanation you can interrogate, and a refusal you can overrule. An agent
        that only complies is a switch.

  - n: "03"
    left:
      party: ai
      title: AI → Building
      text: >-
        Commands under constraint — grid, cost, physics, and the other occupants
        who never asked for anything.
    right:
      party: bldg
      title: Building → AI
      text: >-
        Telemetry and ground truth. Sensor streams, equipment state, and whether
        the command actually landed. The building is the one thing that can keep
        the AI's model of it honest.

closing:
  lead: The sixth channel is the one that runs back to you.
  punch: What it does to the other five is the research.

# ---------------------------------------------------------------------------
# The three arrangements the figure steps through, in the order the field got
# to them. What changes between them is which channels exist — and what the
# middle node IS. A rule-based loop has a controller, not an agent, so the node
# relabels rather than pretending a PID loop had AI in it.
#
# Each channel is `from`/`to` over the node keys human | mid | bldg, plus the
# geometry that places it. The numbers are pixels in the figure's own 640x366
# coordinate space, and they live here next to the words they position:
#
#   bow      how far the curve bends off the straight line, and which side.
#            The normal is (-uy, ux), so a positive bow pushes a left-to-right
#            channel BELOW the row and a right-to-left channel ABOVE it. Two
#            directions of the same pair therefore never sit on top of each
#            other at the same bow.
#   under    departure angle in degrees from vertical, for the long
#            human-building channels that leave the bottom of each disc rather
#            than the side.
#   below    force the label under its line instead of over it.
#   labelT   position along the curve, 0 to 1. Defaults to 0.34, near the
#            source; the agent's outbound channels use mid-span.
#   calloutX/Y  pin the label at a fixed point and draw a leader down to the
#            line, for labels too large to sit on it.
#
# `tag` breaks into lines on \n. `live` is modeled by the arrangement; `weak`
# happens in the world but goes unaccounted for.
modes:
  - key: loop
    name: Rule-based
    labels: { human: Human, mid: Controller, bldg: Building }
    live:
      - { from: human, to: mid,   tag: "setpoint", bow: 0 }
      - { from: mid,   to: bldg,  tag: "command",  bow: 0, below: true }
      - { from: bldg,  to: mid,   tag: "feedback", bow: 168 }
    weak:
      - { from: bldg,  to: human, tag: "the room acts on you\nnobody measures it", bow: -286, under: 20 }
      - { from: human, to: bldg,  tag: "you change the room\nnobody records it",   bow: 122,  under: 58 }
    hint: >-
      The arrangement the field started with. No AI in it — the middle box is a
      thermostat or a controller, closing a loop around the equipment.
    miss: >-
      You and the building are still in direct contact, all day, every day. The
      loop simply does not account for it — and it has nothing to say back to you.
    legend: 3 modeled · 2 real, but unaccounted for

  # Occupant-centric control does not change the controller-building side at
  # all, so it is drawn exactly as the rule-based mode draws it. What moves is
  # everything on the occupant's side — including opening the window, which
  # occupant-behavior models do account for. Five of the six.
  - key: occ
    name: Occupant-centric
    labels: { human: Human, mid: Controller, bldg: Building }
    live:
      - { from: human, to: mid,   tag: "multi-modal sensing\n(physiology, perceptual\nrating, motion)", bow: 0, calloutX: 158, calloutY: 38 }
      - { from: mid,   to: bldg,  tag: "command",  bow: 0, below: true }
      - { from: bldg,  to: mid,   tag: "feedback", bow: 168 }
      - { from: bldg,  to: human, tag: "the room acts on you\nnow measured", bow: -286, under: 20 }
      - { from: human, to: bldg,  tag: "you change the room\nnow recorded",  bow: 122,  under: 58 }
    weak: []
    # The occupant model, drawn overlapping the controller because it may sit
    # inside it or beside it.
    extras:
      - { at: [282, 68], r: 36, label: Model, party: ai }
    hint: >-
      Occupant-centric control. The same one channel from the occupant now
      carries far more — physiological response, perceptual comfort ratings,
      motion as a proxy for occupancy. Multi-modal sensing, rather than a number.
    miss: >-
      Five of the six. Everything you do and everything you feel is now accounted
      for. The one channel still missing is the one that would make it a
      collaboration: nothing comes back for you to interrogate or overrule.
    legend: 5 modeled · 1 missing — the one running back to you

  # Both of the agent's outbound channels take the upper route and both inbound
  # channels the lower one, so the top of the figure is the agent talking and
  # the bottom is the agent listening, mirrored either side of it.
  - key: triangle
    name: Human–AI–Building Interaction
    labels: { human: Human, mid: AI, bldg: Building }
    live:
      - { from: human, to: mid,   tag: "you say it", bow: 26 }
      - { from: mid,   to: human, tag: "explains its\nreasoning",   bow: 26,  labelT: 0.52 }
      - { from: mid,   to: bldg,  tag: "commands after\ndiscussion", bow: -26, labelT: 0.52 }
      - { from: bldg,  to: mid,   tag: "telemetry", bow: -26 }
      - { from: bldg,  to: human, tag: "the room acts on you\nnow measured", bow: -286, under: 20 }
      - { from: human, to: bldg,  tag: "you change the room\nnow recorded",  bow: 122,  under: 58 }
    weak: []
    # The six descriptions above stand in for the caption in this mode, so it
    # carries no hint or miss of its own.
    legend: 6 modeled · nothing left unaccounted
