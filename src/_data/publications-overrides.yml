# ---------------------------------------------------------------------------
# Per-DOI corrections, for the cases where the publisher registered something
# unhelpful. Any of `title`, `venue`, `kind` or `slug` may be set.
#
# Springer publishes these conference proceedings inside a book series, so
# Crossref reports the series name as the venue and the type as a chapter.
# ---------------------------------------------------------------------------
fix:
  10.1007/978-3-031-84224-5_14:
    kind: conference
    venue: >-
      The 20th Conference of the International Society for Computing in Civil
      and Building Engineering (ICCCBE 2024)
  10.1007/978-3-319-91638-5_12:
    kind: conference
    venue: >-
      The 25th International Workshop on Intelligent Computing in Engineering
      (EG-ICE 2018)
  10.1016/j.buildenv.2025.113471:
    slug: pecs-review-performance-evaluation-methods
  10.1016/j.buildenv.2025.113541:
    slug: pecs-review-benefits

# ---------------------------------------------------------------------------
# Papers with no DOI, transcribed from the CV.
#
# Older conference proceedings often were never assigned one. These render
# without a link, and their citation file carries no DO/UR line, but they are
# real papers and belong on the list. If a DOI ever appears, move the entry to
# `extra` above and delete it from here.
#
# `date` is the conference date and only affects ordering within the year.
# `authors` is "Last, First", as everywhere else — and each name MUST be
# quoted, or YAML splits it on the comma into two people.
# ---------------------------------------------------------------------------
