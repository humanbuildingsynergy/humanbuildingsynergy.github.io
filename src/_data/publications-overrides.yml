# Corrections to the automatic publication list. This is the ONLY file to edit
# by hand — everything else comes from ORCID and Crossref at build time.
#
# Claiming a paper in ORCID is what puts it on the site. Nothing here adds a
# paper except `extra`, and that is a stopgap.

# ---------------------------------------------------------------------------
# Papers to leave off the site entirely.
#
# The 2024 Taylor & Francis book is registered with a DOI per chapter as well
# as one for the book, so ORCID reports eleven works for one book. The chapters
# are dropped and the book itself is kept.
# ---------------------------------------------------------------------------
exclude:
  - 10.4324/9780367814748-1    # Introduction
  - 10.4324/9780367814748-3    # Human Health and Wellbeing Measures
  - 10.4324/9780367814748-4    # Environmental Measures
  - 10.4324/9780367814748-5    # Material Measures
  - 10.4324/9780367814748-7    # Sensing and Data Acquisition
  - 10.4324/9780367814748-8    # Measurement Tools and Technologies
  - 10.4324/9780367814748-9    # Design and Analysis Methods
  - 10.4324/9780367814748-11   # Case Studies
  - 10.4324/9780367814748-12   # Future Directions

# ---------------------------------------------------------------------------
# Papers not yet claimed in ORCID.
#
# This list should shrink to nothing. Claim each of these in ORCID — it is the
# record NSF, Scopus and Web of Science read — then delete the line here.
# ---------------------------------------------------------------------------
