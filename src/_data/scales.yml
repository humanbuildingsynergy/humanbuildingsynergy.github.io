# The five research scales, body outward to city.
# `triangle` states how the three parties relate at that scale — it is what
# ties each research area back to the Human–AI–Building framing.
intro: >-
  Human–AI–Building interaction is not a sixth research area beside the others —
  it is how we now approach all five, from a single body to a whole city.

scales:
  - id: body
    tab: Body
    metric: ≈ one person
    title: Occupant Comfort, Behaviour, and Health
    text: >-
      People do not experience a room the way a sensor does. We study how
      individuals perceive and respond to their environment, and how
      that diversity should reshape the way buildings are run.
    points:
      - Personal, context-aware comfort understanding and modeling
      - Non-invasive physiological sensing
      - Multi-modality, including language information
    triangle: >-
      The body reports in its own words, the AI learns what those words mean for
      that person, and the building conditions at the scale of one desk.

  - id: room
    tab: Room
    metric: ≈ one zone
    title: Human-Centric Building Control and Assessment
    text: >-
      We build the capability that (1) senses and communicates occupant needs and
      (2) controls adaptively and responsively.
    points:
      - Human-centric HVAC from multi-modal sensing channels
      - Agentic AI architecture within buildings
      - Indoor environmental quality measurement and assessment
    triangle: >-
      Occupants want different things and they should be met as much as possible
      through a systematic manner.

  - id: building
    tab: Building
    metric: ≈ one building
    title: Building Knowledge Graph · Building Energy Modeling  
    text: >-
      We contribute to machine-readable representation of buildings and their 
      performance analysis through simulation and validation.
    points:
      - Brick and ASHRAE 223P
      - Knowledge graph question and answering (KGQA)
      - White and grey box modeling through EnergyPlus and OpenModelica 
    triangle: >-
      The AI-compatible technology will facilitate the interaction between humans and
      buildings. 

  - id: grid
    tab: Grid
    metric: ≈ one feeder
    title: Grid-Interactive Effective Buildings (GEB)
    text: >-
      Buildings are no longer passive loads. We examine how buildings can reduce and shift load, 
      and negotiate with the grid.
    points:
      - High resolution and granularity in power/energy monitoring and its analysis
      - GEB technology adoption, development, and implementation
    triangle: >-
      A new territory where buildings can play an active role.

  - id: city
    tab: City
    metric: ≈ one city
    title: Urban energy modelling
    text: >-
      Scaling from one building to a community changes the question. We build the
      occupancy and behaviour inputs urban-scale models need, so aggregate
      projections rest on how people actually behave in buildings.
    points:
      - Data-driven and agentic AI modeling from population-level data
    triangle: >-
      Decisions are made in aggregate but land on individual occupants.
