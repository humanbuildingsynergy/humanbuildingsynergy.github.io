description: >-
  The Human Building Synergy Laboratory (HUBS) at the University of Arizona
  studies Human–AI–Building Interaction — how occupants, agentic AI, and physical
  building systems sense, reason, act, and collaborate with one another.

# The title card. Each fragment is one animated word-group; `party` colours it
# (human / ai / bldg) and anything without a party stays in the base ink.
# The title card. Add more entries under `titleCards` and one is picked at
# random on each visit — with a single entry it simply always shows that one.
#
# Each fragment animates in as its own beat. `party` colours it
# (human = amber, ai = cyan, bldg = violet); fragments without one stay in the
# base ink. The payoff carries no colour on purpose — the three parties are the
# colours, and the synergy is what they add up to.
# The first four fragments stay fixed across every variant — only the payoff
# changes. That keeps one recognisable phrase while giving returning visitors
# something that shifts.
titleCards:
  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Synergy." }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Collaboration." }

# The homepage headline — one clause per party.
headline:
  - { text: "The building acts.", party: bldg }
  - { text: "The AI reasons.", party: ai }
  - { text: "You decide.", party: human }

lede: >-
  Three parties, and none of them is in charge by default. We study the
  interaction and collaboration between them — what each one can sense, what each one may do, and
  how they arrive at an outcome none of them controls alone. Take the occupant's side below.

