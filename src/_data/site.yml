# Global site settings. Edit here once; every page picks it up.
name: Human Building Synergy Laboratory
shortName: HUBS          # the wordmark in the top-left corner
titleName: HUBS Lab      # what appears in the browser tab and in search results
researchArea: Human–AI–Building Interaction
url: https://hubs.engr.arizona.edu
description: >-
  The Human Building Synergy Laboratory (HUBS) at the University of Arizona
  studies Human–AI–Building Interaction — how occupants, agentic AI, and physical
  building systems sense, reason, act, and negotiate with one another.

# The title card. Each fragment is one animated word-group; `party` colours it
# (human / ai / bldg) and anything without a party stays in the base ink.
titleCard:
  - { text: "You,", party: human }
  - { text: "the AI,", party: ai }
  - { text: "and" }
  - { text: "the building", party: bldg }
  - { text: "are all" }
  - { text: "interacting now." }

# The homepage headline — one clause per party.
headline:
  - { text: "The building acts.", party: bldg }
  - { text: "The AI reasons.", party: ai }
  - { text: "You decide.", party: human }

lede: >-
  Three parties, and none of them is in charge by default. We study the
  negotiation between them — what each one can sense, what each one may do, and
  who gets the last word when they disagree. Try disagreeing.

department: Civil & Architectural Engineering & Mechanics
university: The University of Arizona

