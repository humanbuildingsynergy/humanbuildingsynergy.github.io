name: Human Building Synergy Laboratory
shortName: HUBS          # the wordmark in the top-left corner
titleName: HUBS Lab      # what appears in the browser tab and in search results
researchArea: Human–AI–Building Interaction
url: https://hubs.engr.arizona.edu

# Google Search Console ownership token. Rendered as a meta tag on every page.
# Leave it in place — removing it un-verifies the property.
googleSiteVerification: lpLfYuf2NiFr28VWYJR2qS6dIbo4X-YzsNhNNdYjEOI
description: >-
  The Human Building Synergy Laboratory (HUBS) at the University of Arizona
  studies Human–AI–Building Interaction — how occupants, agentic AI, and physical
  building systems sense, reason, act, and collaborate with one another.

# The title card. One entry is picked at random per visit. The first four
# fragments stay fixed across every variant — only the payoff changes, so one
# phrase stays recognisable while returning visitors get some variety.
#
# `party` colours a fragment: human = amber, ai = cyan, bldg = violet,
# accent = Arizona Red. Each payoff below is coloured by the party that word
# most implicates:
#   Synergy        accent — the lab's own word, belonging to no single party
#   Conversation   amber  — language is the human's channel
#   the Loop       cyan   — the control loop is the AI's territory
#   Collaboration  violet — the claim that the building is a partner, not equipment
titleCards:
  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Synergy.", party: accent }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Conversation.", party: human }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in the Loop.", party: ai }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Collaboration.", party: bldg }

  # The odd one out on purpose: a process rather than a state, and the only
  # reciprocal one — so it takes no party colour at all.
  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— Learning Each Other." }

# The homepage headline. Like the title card, one variant is picked per visit.
#
# Each is a three-beat story: something happens, something makes sense of it,
# someone responds. If you add more, keep two properties —
#
#   1. Rotate the verbs. Read down the list, no party is stuck with one job:
#        building  acts · moves · senses · reports
#        AI        reasons · plans · explains · learns
#        you       decide · ask · decide · correct
#      That is what stops a fixed headline from pigeonholing anyone.
#
#   2. Name all three parties, so the colour legend (amber = human,
#      cyan = AI, violet = building) is taught before the diagram below.
headlines:
  # a request answered
  - fragments:
      - { text: "The building acts.", party: bldg }
      - { text: "The AI reasons.", party: ai }
      - { text: "You decide.", party: human }

  # something is asked for
  - fragments:
      - { text: "You ask.", party: human }
      - { text: "The AI plans.", party: ai }
      - { text: "The building moves.", party: bldg }

  # something is noticed
  - fragments:
      - { text: "The building senses.", party: bldg }
      - { text: "The AI explains.", party: ai }
      - { text: "You decide.", party: human }

  # something is learned
  - fragments:
      - { text: "The building reports.", party: bldg }
      - { text: "The AI learns.", party: ai }
      - { text: "You correct.", party: human }

lede: >-
  Three parties, and none of them is in charge by default. We study the
  interaction and collaboration between them — what each one can sense, what each one may do, and
  how the three of them find a synergy none could reach alone. Take the occupant's side below.

