# Google Search Console ownership token. Rendered as a meta tag on every page.
# Leave it in place — removing it un-verifies the property.
googleSiteVerification: lpLfYuf2NiFr28VWYJR2qS6dIbo4X-YzsNhNNdYjEOI
description: >-
  The Human Building Synergy Laboratory (HUBS) at the University of Arizona
  studies Human–AI–Building Interaction — how occupants, agentic AI, and physical
  building systems sense, reason, act, and collaborate with one another.

# The title card. One entry is picked at random per visit. The first four
# fragments stay fixed across every variant — only the payoff changes, so one
# phrase stays recognisable while returning visitors get some variety.
#
# `party` colours a fragment: human = amber, ai = cyan, bldg = violet,
# accent = Arizona Red. Each payoff below is coloured by the party that word
# most implicates:
#   Synergy        accent — the lab's own word, belonging to no single party
#   Conversation   amber  — language is the human's channel
#   the Loop       cyan   — the control loop is the AI's territory
#   Collaboration  violet — the claim that the building is a partner, not equipment
titleCards:
  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Synergy.", party: accent }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Conversation.", party: human }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in the Loop.", party: ai }

  - fragments:
      - { text: "You,", party: human }
      - { text: "the AI,", party: ai }
      - { text: "and" }
      - { text: "the Building", party: bldg }
      - { text: "— in Collaboration.", party: bldg }

# The homepage headline — one clause per party.
headline:
  - { text: "The building acts.", party: bldg }
  - { text: "The AI reasons.", party: ai }
  - { text: "You decide.", party: human }

lede: >-
  Three parties, and none of them is in charge by default. We study the
  interaction and collaboration between them — what each one can sense, what each one may do, and
  how they arrive at an outcome none of them controls alone. Take the occupant's side below.

