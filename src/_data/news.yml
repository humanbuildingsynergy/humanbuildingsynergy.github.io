# Lab news. ONE list — the homepage shows the newest few, the news page shows
# all of them grouped by year, and the RSS feed reads the same list.
# To add an item: copy a block to the top. `date` is YYYY-MM.
# `type` drives the little icon: publication, grant, conference, seminar,
# service, people, outreach, milestone.
# `text` may contain inline HTML links.

